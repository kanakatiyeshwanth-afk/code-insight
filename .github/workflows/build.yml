name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ 17, 21 ]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Compile and run automated tests
      run: mvn --batch-mode --errors test

    - name: Package application JAR
      run: mvn --batch-mode --errors package -DskipTests

    - name: Archive build artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-insight-jdk${{ matrix.java-version }}
        path: target/*.jar

